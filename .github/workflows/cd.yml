name: CD 

on:
  workflow_run:
    workflows: ["CI/CD"]
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::010569744430:role/de
          aws-region: eu-central-1

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region eu-central-1 \
            --name devops-demo

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/

      - name: Deploy new Docker image
        run: |
          kubectl set image deployment/devops-demo \
            backend=ghcr.io/jakubsikora57/devops-demo:${{ github.event.workflow_run.head_sha }}

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/devops-demo --timeout=180s
